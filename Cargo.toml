[workspace]
resolver = "2"
members = ["src/core", "src/tui", "src/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Thierry Soulié <contact@tsodev.fr>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
rand = "0.8"
rand_pcg = "0.3"
ratatui = "0.26"
crossterm = "0.27"
