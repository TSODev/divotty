[package]
name = "divotty"
version = "0.2.0"
edition = "2021"
authors = ["Thierry Soulié <contact@tsodev.fr>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TSODev/divotty"
homepage = "https://github.com/TSODev/divotty"
description = "A dice-and-terminal golf game — aim, roll, and pray you dodge the water."
keywords = ["golf", "tui", "terminal", "game"]
categories = ["games", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "divotty"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
rand = "0.8"
rand_pcg = "0.3"
ratatui = "0.26"
crossterm = "0.27"
